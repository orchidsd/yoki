; ============================================================
;  subconverter 外部配置模板 (参照 mihomo.yaml 结构)
;  用法: /sub?target=clash&url=<订阅URL>&config=<本文件URL>&new_name=true
;  家宽(OpenVPN)/ECH 节点由转换器丢弃,故本模板不含家宽链
; ============================================================

[custom]
; ---------- 节点筛选正则 (照抄 mihomo.yaml rule-anchor) ----------
; CF
custom_proxy_group=cfcdn手动`select`(?=.*(域名|官方|防|电信|移动|联通|CT|CU|CM|CF|t\.me))^((?!(港|台|日|韩|新|深|美)).)*$
custom_proxy_group=cfcdn故转`fallback`(?=.*(域名|官方|防|电信|移动|联通|CT|CU|CM|CF|t\.me))^((?!(港|台|日|韩|新|深|美)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=cfcdn自动`url-test`(?=.*(域名|官方|防|电信|移动|联通|CT|CU|CM|CF|t\.me))^((?!(港|台|日|韩|新|深|美)).)*$`https://www.gstatic.com/generate_204`300,,50
; HK
custom_proxy_group=香港手动`select`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=香港故转`fallback`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=香港自动`url-test`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$`https://www.gstatic.com/generate_204`300,,50
; JP
custom_proxy_group=日本手动`select`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=日本故转`fallback`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=日本自动`url-test`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$`https://www.gstatic.com/generate_204`300,,50
; TW
custom_proxy_group=台湾手动`select`(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$
custom_proxy_group=台湾故转`fallback`(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=台湾自动`url-test`(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$`https://www.gstatic.com/generate_204`300,,50
; SG
custom_proxy_group=狮城手动`select`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$
custom_proxy_group=狮城故转`fallback`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=狮城自动`url-test`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$`https://www.gstatic.com/generate_204`300,,50
; US
custom_proxy_group=美国手动`select`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$
custom_proxy_group=美国故转`fallback`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国自动`url-test`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$`https://www.gstatic.com/generate_204`300,,50
; 全部 (Exclude: 剔除订阅信息节点)
custom_proxy_group=全部手动`select`^((?!(优选网|官网|剩余|流量|套餐|订阅|到期时间|直连|GB|Expire Date|Traffic|ExpireDate)).)*$
custom_proxy_group=全部自动`url-test`^((?!(优选网|官网|剩余|流量|套餐|订阅|到期时间|直连|GB|Expire Date|Traffic|ExpireDate)).)*$`https://www.gstatic.com/generate_204`300,,50

