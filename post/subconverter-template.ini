; subconverter 外部配置模板 —— 由 mihomo.yaml 转换而来
; 用法: https://url.v1.mk/sub?target=clash&url=<订阅URL>&config=<本文件URL>&new_name=true&emoji=false

[custom]
; 直连分组（内置）
custom_proxy_group=直连`select`DIRECT

; ==================== 手动选择组 (原 &SD + filter) ====================
; 注: 以 ` 分隔三字段: 组名`类型`筛选正则
; 节点筛选复刻 mihomo.yaml 的 rule-anchor 正则 (PCRE2 兼容)

custom_proxy_group=cfcdn手动`select`(?=.*(域名|官方|防|电信|移动|联通|CT|CU|CM|CF|t.me))^((?!(港|台|日|韩|新|深|美)).)*$
custom_proxy_group=香港手动`select`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=日本手动`select`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=台湾手动`select`(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$
custom_proxy_group=狮城手动`select`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$
custom_proxy_group=美国手动`select`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$
custom_proxy_group=🏠 家宽手动`select`(?=.*家宽)

; ==================== 故障转移组 (原 &FB + filter) ====================
; fallback 需要 url 测活参数: `url=xxx` 放在筛选正则后
; 注: 多个 ` 用 \` 转义? 实测是 url= 参数放第四个字段

custom_proxy_group=cfcdn故转`fallback`(?=.*(域名|官方|防|电信|移动|联通|CT|CU|CM|CF|t.me))^((?!(港|台|日|韩|新|深|美)).)*$
custom_proxy_group=香港故转`fallback`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=日本故转`fallback`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=台湾故转`fallback`(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$
custom_proxy_group=狮城故转`fallback`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$
custom_proxy_group=美国故转`fallback`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$
custom_proxy_group=🏠 家宽故转`fallback`(?=.*家宽)

; ==================== 自动测速组 (原 &URL + filter) ====================
custom_proxy_group=cfcdn自动`url-test`(?=.*(域名|官方|防|电信|移动|联通|CT|CU|CM|CF|t.me))^((?!(港|台|日|韩|新|深|美)).)*$
custom_proxy_group=香港自动`url-test`(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
custom_proxy_group=日本自动`url-test`(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
custom_proxy_group=台湾自动`url-test`(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$
custom_proxy_group=狮城自动`url-test`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$
custom_proxy_group=美国自动`url-test`(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$

; ==================== 全部组 (原 &Exclude) ====================
custom_proxy_group=全部手动`select`^((?!(优选网|官网|剩余|流量|套餐|订阅|到期时间|直连|GB|Expire Date|Traffic|ExpireDate)).)*$
custom_proxy_group=全部自动`url-test`^((?!(优选网|官网|剩余|流量|套餐|订阅|到期时间|直连|GB|Expire Date|Traffic|ExpireDate)).)*$

